<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习进度 - 个性化学习路径管理</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .main-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .progress-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .progress-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .progress-card:hover {
            transform: translateY(-5px);
        }

        .progress-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transition: all 0.5s ease;
        }

        .progress-card:hover::before {
            top: -25%;
            right: -25%;
        }

        .progress-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .progress-value {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .progress-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .progress-trend {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .trend-up {
            color: #4ade80;
        }

        .trend-down {
            color: #f87171;
        }

        .progress-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            color: #667eea;
        }

        .learning-path {
            margin-bottom: 30px;
        }

        .path-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .path-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .path-item.completed {
            border-color: #10b981;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
        }

        .path-item.current {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        }

        .path-item.upcoming {
            border-color: #6b7280;
            opacity: 0.7;
        }

        .path-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 20px;
        }

        .path-item.completed .path-number {
            background: #10b981;
        }

        .path-item.current .path-number {
            background: #f59e0b;
        }

        .path-content {
            flex: 1;
        }

        .path-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .path-description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }

        .path-progress {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .path-progress-bar {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .path-progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .path-item.completed .path-progress-fill {
            background: #10b981;
        }

        .path-item.current .path-progress-fill {
            background: #f59e0b;
        }

        .path-progress-text {
            font-size: 0.8rem;
            color: #666;
            font-weight: 500;
        }

        .chapter-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .study-calendar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav button {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-nav button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .calendar-day-header {
            text-align: center;
            padding: 10px;
            font-weight: bold;
            color: #666;
            font-size: 0.9rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .calendar-day:hover {
            background: #f8f9fa;
        }

        .calendar-day.active {
            background: #667eea;
            color: white;
        }

        .calendar-day.has-study {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .calendar-day.today {
            border: 2px solid #f59e0b;
        }

        .study-time {
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .goals-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .goals-list {
            display: grid;
            gap: 15px;
        }

        .goal-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .goal-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .goal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .goal-progress {
            margin-left: auto;
            font-size: 0.9rem;
            color: #667eea;
            font-weight: bold;
        }

        .goal-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .goal-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .goal-deadline {
            font-size: 0.85rem;
            color: #666;
        }

        .achievements {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .achievement-badge {
            aspect-ratio: 1;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            padding: 15px;
            border: 3px solid transparent;
        }

        .achievement-badge.earned {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border-color: #f59e0b;
        }

        .achievement-badge.locked {
            background: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
        }

        .achievement-badge:hover {
            transform: translateY(-3px);
        }

        .achievement-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .achievement-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .progress-sections {
                grid-template-columns: 1fr;
            }
            
            .progress-overview {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .calendar-nav {
                display: none;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content > * {
            animation: fadeInUp 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> 学习进度</h1>
            <p class="subtitle">个性化学习路径管理 · 学习效果分析</p>
        </div>

        <a href="/" class="back-button">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>

        <div class="main-content">
            <!-- 进度总览 -->
            <div class="progress-overview">
                <div class="progress-card">
                    <div class="progress-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="progress-value" id="studyTime">45.5</div>
                    <div class="progress-label">总学习时长(小时)</div>
                    <div class="progress-trend trend-up">
                        <i class="fas fa-arrow-up"></i> 比上周 +12%
                    </div>
                </div>

                <div class="progress-card">
                    <div class="progress-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <div class="progress-value" id="masteryLevel">85%</div>
                    <div class="progress-label">知识掌握度</div>
                    <div class="progress-trend trend-up">
                        <i class="fas fa-arrow-up"></i> 比上月 +8%
                    </div>
                </div>

                <div class="progress-card">
                    <div class="progress-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="progress-value" id="completedChapters">18</div>
                    <div class="progress-label">已完成章节</div>
                    <div class="progress-trend trend-up">
                        <i class="fas fa-arrow-up"></i> 比计划 +3
                    </div>
                </div>

                <div class="progress-card">
                    <div class="progress-icon">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div class="progress-value" id="streakDays">12</div>
                    <div class="progress-label">连续学习天数</div>
                    <div class="progress-trend trend-up">
                        <i class="fas fa-arrow-up"></i> 个人最佳记录
                    </div>
                </div>
            </div>

            <div class="progress-sections">
                <!-- 学习路径 -->
                <div class="section">
                    <div class="section-title">
                        <i class="fas fa-route section-icon"></i>
                        学习路径
                    </div>
                    <div class="learning-path" id="learningPath">
                        <!-- 动态生成学习路径 -->
                    </div>
                </div>

                <!-- 章节统计 -->
                <div class="section">
                    <div class="section-title">
                        <i class="fas fa-chart-bar section-icon"></i>
                        章节统计
                    </div>
                    <div class="chapter-stats" id="chapterStats">
                        <!-- 动态生成章节统计 -->
                    </div>
                </div>
            </div>

            <!-- 学习日历 -->
            <div class="study-calendar">
                <div class="calendar-header">
                    <div class="calendar-title">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="calendarTitle">2024年1月</span>
                    </div>
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button onclick="changeMonth(1)">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- 动态生成日历 -->
                </div>
            </div>

            <!-- 学习目标 -->
            <div class="goals-section">
                <div class="section-title">
                    <i class="fas fa-bullseye section-icon"></i>
                    学习目标
                </div>
                <div class="goals-list" id="goalsList">
                    <!-- 动态生成学习目标 -->
                </div>
            </div>

            <!-- 成就徽章 -->
            <div class="goals-section">
                <div class="section-title">
                    <i class="fas fa-medal section-icon"></i>
                    成就徽章
                </div>
                <div class="achievements" id="achievements">
                    <!-- 动态生成成就徽章 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 学习数据
        const studyData = {
            totalTime: 45.5,
            masteryLevel: 85,
            completedChapters: 18,
            streakDays: 12,
            currentMonth: 0, // 0表示当前月份
            learningPath: [
                {
                    id: 1,
                    title: '心血管系统基础',
                    description: '心脏解剖结构与生理功能',
                    progress: 100,
                    status: 'completed',
                    estimatedTime: '8小时',
                    actualTime: '7.5小时'
                },
                {
                    id: 2,
                    title: '心脏病分类与诊断',
                    description: '常见心脏病的分类标准与诊断方法',
                    progress: 75,
                    status: 'current',
                    estimatedTime: '12小时',
                    actualTime: '9小时'
                },
                {
                    id: 3,
                    title: '高血压病管理',
                    description: '原发性和继发性高血压的诊疗',
                    progress: 30,
                    status: 'current',
                    estimatedTime: '10小时',
                    actualTime: '3小时'
                },
                {
                    id: 4,
                    title: '心律失常诊治',
                    description: '常见心律失常的识别与处理',
                    progress: 0,
                    status: 'upcoming',
                    estimatedTime: '15小时',
                    actualTime: '0小时'
                },
                {
                    id: 5,
                    title: '心力衰竭治疗',
                    description: '急慢性心力衰竭的综合管理',
                    progress: 0,
                    status: 'upcoming',
                    estimatedTime: '12小时',
                    actualTime: '0小时'
                }
            ],
            chapterStats: [
                { name: '心血管解剖', completed: 25, total: 25, accuracy: 92 },
                { name: '心脏病诊断', completed: 18, total: 22, accuracy: 87 },
                { name: '高血压管理', completed: 12, total: 20, accuracy: 79 },
                { name: '心律失常', completed: 8, total: 18, accuracy: 85 },
                { name: '心力衰竭', completed: 3, total: 15, accuracy: 88 }
            ],
            goals: [
                {
                    title: '完成心血管基础学习',
                    progress: 85,
                    deadline: '2024-01-15',
                    total: 100
                },
                {
                    title: '月度学习时长达到50小时',
                    progress: 91,
                    deadline: '2024-01-31',
                    total: 50
                },
                {
                    title: '章节测试平均分达到90分',
                    progress: 88,
                    deadline: '2024-01-20',
                    total: 100
                }
            ],
            achievements: [
                { name: '初学者', icon: 'fas fa-seedling', earned: true },
                { name: '坚持者', icon: 'fas fa-fire', earned: true },
                { name: '心血管专家', icon: 'fas fa-heart', earned: true },
                { name: '学习之星', icon: 'fas fa-star', earned: true },
                { name: '完美主义者', icon: 'fas fa-crown', earned: false },
                { name: '知识探索者', icon: 'fas fa-compass', earned: false },
                { name: '快速学习者', icon: 'fas fa-rocket', earned: false },
                { name: '医学大师', icon: 'fas fa-graduation-cap', earned: false }
            ],
            calendarData: {
                // 2024年1月的学习数据
                0: {
                    1: { studyTime: 2.5, completed: true },
                    2: { studyTime: 3.0, completed: true },
                    3: { studyTime: 1.5, completed: true },
                    5: { studyTime: 4.0, completed: true },
                    6: { studyTime: 2.0, completed: true },
                    7: { studyTime: 3.5, completed: true },
                    8: { studyTime: 2.8, completed: true },
                    9: { studyTime: 1.2, completed: true },
                    10: { studyTime: 3.2, completed: true },
                    11: { studyTime: 2.7, completed: true },
                    12: { studyTime: 4.5, completed: true }
                }
            }
        };

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeProgressData();
        });

        // 初始化进度数据
        function initializeProgressData() {
            updateOverviewStats();
            renderLearningPath();
            renderChapterStats();
            renderCalendar();
            renderGoals();
            renderAchievements();
        }

        // 更新概览统计
        function updateOverviewStats() {
            document.getElementById('studyTime').textContent = studyData.totalTime;
            document.getElementById('masteryLevel').textContent = studyData.masteryLevel + '%';
            document.getElementById('completedChapters').textContent = studyData.completedChapters;
            document.getElementById('streakDays').textContent = studyData.streakDays;
        }

        // 渲染学习路径
        function renderLearningPath() {
            const container = document.getElementById('learningPath');
            container.innerHTML = studyData.learningPath.map(item => `
                <div class="path-item ${item.status}" onclick="openChapter(${item.id})">
                    <div class="path-number">${item.id}</div>
                    <div class="path-content">
                        <div class="path-title">${item.title}</div>
                        <div class="path-description">${item.description}</div>
                        <div class="path-progress">
                            <div class="path-progress-bar">
                                <div class="path-progress-fill" style="width: ${item.progress}%"></div>
                            </div>
                            <div class="path-progress-text">${item.progress}%</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染章节统计
        function renderChapterStats() {
            const container = document.getElementById('chapterStats');
            container.innerHTML = studyData.chapterStats.map(stat => `
                <div class="stat-item">
                    <div class="stat-value">${stat.completed}/${stat.total}</div>
                    <div class="stat-label">${stat.name}</div>
                    <div class="stat-label" style="margin-top: 5px; color: #667eea;">
                        正确率: ${stat.accuracy}%
                    </div>
                </div>
            `).join('');
        }

        // 渲染日历
        function renderCalendar() {
            const currentDate = new Date();
            const month = currentDate.getMonth() + studyData.currentMonth;
            const year = currentDate.getFullYear();
            
            // 更新标题
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', 
                              '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('calendarTitle').textContent = 
                `${year}年${monthNames[month]}`;

            // 获取月份的第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            const daysContainer = document.getElementById('calendarGrid');
            daysContainer.innerHTML = '';

            // 添加星期标题
            const dayHeaders = ['日', '一', '二', '三', '四', '五', '六'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                daysContainer.appendChild(header);
            });

            // 添加日期
            const monthData = studyData.calendarData[studyData.currentMonth] || {};
            const today = new Date();
            let currentDay = new Date(startDate);

            for (let i = 0; i < 42; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                const dayNumber = currentDay.getDate();
                const isCurrentMonth = currentDay.getMonth() === month;
                const isToday = currentDay.toDateString() === today.toDateString();
                const dayData = monthData[dayNumber];

                if (!isCurrentMonth) {
                    dayElement.style.opacity = '0.3';
                }

                if (isToday) {
                    dayElement.classList.add('today');
                }

                if (dayData && isCurrentMonth) {
                    dayElement.classList.add('has-study');
                }

                dayElement.innerHTML = `
                    <div>${dayNumber}</div>
                    ${dayData ? `<div class="study-time">${dayData.studyTime}h</div>` : ''}
                `;

                daysContainer.appendChild(dayElement);
                currentDay.setDate(currentDay.getDate() + 1);
            }
        }

        // 渲染学习目标
        function renderGoals() {
            const container = document.getElementById('goalsList');
            container.innerHTML = studyData.goals.map(goal => `
                <div class="goal-item">
                    <div class="goal-header">
                        <div class="goal-title">${goal.title}</div>
                        <div class="goal-progress">${goal.progress}%</div>
                    </div>
                    <div class="goal-bar">
                        <div class="goal-bar-fill" style="width: ${goal.progress}%"></div>
                    </div>
                    <div class="goal-deadline">
                        <i class="fas fa-calendar"></i>
                        截止日期: ${goal.deadline}
                    </div>
                </div>
            `).join('');
        }

        // 渲染成就徽章
        function renderAchievements() {
            const container = document.getElementById('achievements');
            container.innerHTML = studyData.achievements.map(achievement => `
                <div class="achievement-badge ${achievement.earned ? 'earned' : 'locked'}" 
                     title="${achievement.name}">
                    <div class="achievement-icon">
                        <i class="${achievement.icon}"></i>
                    </div>
                    <div class="achievement-name">${achievement.name}</div>
                </div>
            `).join('');
        }

        // 改变月份
        function changeMonth(direction) {
            studyData.currentMonth += direction;
            
            // 限制在当前月份前后3个月
            if (studyData.currentMonth > 3) studyData.currentMonth = 3;
            if (studyData.currentMonth < -3) studyData.currentMonth = -3;
            
            renderCalendar();
        }

        // 打开章节
        function openChapter(chapterId) {
            const chapter = studyData.learningPath.find(c => c.id === chapterId);
            if (chapter) {
                alert(`正在进入: ${chapter.title}\n进度: ${chapter.progress}%\n预计时长: ${chapter.estimatedTime}`);
            }
        }

        // 模拟数据更新
        function updateProgressData() {
            // 模拟学习进度更新
            studyData.totalTime += Math.random() * 2;
            studyData.masteryLevel = Math.min(100, studyData.masteryLevel + Math.random() * 2);
            
            // 更新显示
            updateOverviewStats();
        }

        // 定期更新数据（模拟实时更新）
        setInterval(updateProgressData, 30000); // 每30秒更新一次
    </script>
</body>
</html>
